name: Android test build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Runtime regression tests
        run: python3 runtime-tests/run.py
      - name: Build signed test APK
        run: python3 build.py --build-tools "$ANDROID_HOME/build-tools/35.0.0" --output dist/MOSILA-v0.3.3-test.apk
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=mosila-console/ HEAD -o dist/MOSILA-v0.3.3-source.zip
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.3.3-test-build${GITHUB_RUN_NUMBER}" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "mosila console 0.3.3 test · build ${GITHUB_RUN_NUMBER}" --notes "免费开源测试版。新增首次使用引导、免费开源提示和关于软件。支持 MOSILA 与魔灯客九号 N/F/M 大灯 3.0；硬件效果仍需实物验证。"
