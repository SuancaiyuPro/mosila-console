name: Android release build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Runtime regression tests
        run: python3 runtime-tests/run.py
      - name: Compile release source
        run: python3 build.py --build-tools "$ANDROID_HOME/build-tools/35.0.0" --output dist/verification.apk
      - name: Verify signed official APK
        run: |
          apk=releases/MOSILA-v0.3.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee dist/certificate.txt
          grep -F '5cc43579f4536c651b7c9df0a7f0f052ff28b94f882ae2648fcbd63de8677483' dist/certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | grep -F "versionCode='18' versionName='0.3.4'"
          cp "$apk" dist/MOSILA-v0.3.4.apk
      - name: Package source and checksums
        run: |
          git archive --format=zip --prefix=mosila-console/ HEAD -o dist/MOSILA-v0.3.4-source.zip
          cd dist
          sha256sum MOSILA-v0.3.4.apk MOSILA-v0.3.4-source.zip > SHA256SUMS.txt
      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.4 >/dev/null 2>&1; then
            echo 'v0.3.4 already published; keeping its original assets.'
          else
            gh release create v0.3.4 dist/MOSILA-v0.3.4.apk dist/MOSILA-v0.3.4-source.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --latest --title 'mosila console 0.3.4' --notes '免费开源正式版。支持 MOSILA 与魔灯客九号 N/F/M 大灯 3.0。关于软件含项目地址，已移除设置页底部小字。沿用既有签名，可覆盖安装之前的测试版。硬件效果仍以实物验证为准。'
          fi
